  ja: この会話を新しい会話に分岐して続ける（元の会話はそのまま）
transcript.fork.same:
  en: "Fork here on %{agent}"
  ja: "ここから %{agent} のまま分岐"

cli.folders.empty:
  en: No workspace folders in this project
  ja: このプロジェクトにフォルダーはありません
cli.folders.row:
  en: "%{name} — %{active} active, %{archived} archived"
  ja: "%{name} — アクティブ %{active} 件、アーカイブ %{archived} 件"
sidebar.folder.new:
  en: New folder…
  ja: 新しいフォルダー…
sidebar.folder.ungrouped:
  en: Ungrouped
  ja: 分類なし

sidebar.selection.start:
  en: Select workspaces
  ja: ワークスペースを選択
sidebar.selection.done:
  en: Done selecting
  ja: 選択を終了
sidebar.selection.count:
  en: "%{count} selected"
  ja: "%{count} 件を選択"
sidebar.selection.limit:
  en: Select up to 256 visible workspaces in this project
  ja: このプロジェクトの表示中のワークスペースを 256 件まで選択
sidebar.selection.pin:
  en: Pin every selected workspace (up to 256)
  ja: 選択したすべてのワークスペースをピン留め（256 件まで）
sidebar.selection.unpin:
  en: Unpin every selected workspace (up to 256)
  ja: 選択したすべてのワークスペースのピンを外す（256 件まで）
sidebar.selection.archive:
  en: Archive every selected workspace without deleting its worktree or conversation (up to 256)
  ja: 選択したすべてのワークスペースをアーカイブ（作業ツリーと会話を保持、256 件まで）
sidebar.selection.restore:
  en: Restore every selected workspace to the active list (up to 256)
  ja: 選択したすべてのワークスペースを一覧に戻す（256 件まで）
sidebar.selection.check:
  en: "Select %{name}"
  ja: "%{name} を選択"
sidebar.selection.uncheck:
  en: "Deselect %{name}"
  ja: "%{name} の選択を解除"

sidebar.folder.expand:
  en: "Expand %{name}"
  ja: "%{name} を展開"
sidebar.folder.collapse:
  en: "Collapse %{name}"
  ja: "%{name} を折りたたむ"
sidebar.folder.search_open:
  en: Matching folders stay open while searching
  ja: 検索中は一致するフォルダーを展開します

surface.files.image.zoom_out:
  en: "Zoom out"
  ja: "縮小"
surface.files.image.zoom_in:
  en: "Zoom in"
  ja: "拡大"
surface.files.image.fit:
  en: "Fit"
  ja: "全体を表示"
surface.files.image.help:
  en: "Pinch or Ctrl/⌘ + scroll to zoom; drag to pan. Keyboard: +/−, arrows, 0 to fit. Double-click to fit. Scale is relative to fit."
  ja: "ピンチまたは Ctrl/⌘ + スクロールで拡大・縮小、ドラッグで移動。キー: +/−、矢印、0 で全体表示。ダブルクリックでも全体表示。倍率は全体表示が基準です。"

surface.git.selected_files:
  en: Selected files (%{count})
  ja: 選択したファイル（%{count}件）
surface.git.selection_hint:
  en: Commit complete file contents, including unstaged edits. Other staged files are preserved.
  ja: 未ステージの変更を含め、選択したファイル全体をコミットします。他のファイルのステージ状態は保持します。
surface.git.clear_selection:
  en: Clear selection
  ja: 選択を解除
surface.git.select_file:
  en: Select %{path} for commit
  ja: '%{path} をコミット対象に選択'
surface.git.needs_selection:
  en: Select at least one changed file, or clear the selection.
  ja: 変更されたファイルを1件以上選択するか、選択を解除してください。
