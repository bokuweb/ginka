# Every user-visible string in Ginka, in both languages it ships with.
#
# `_version: 2` keeps the languages side by side so a missing translation is
# visible in review rather than in a running window. Keys are namespaced by the
# region of the UI they belong to; the CLI's own output is under `cli`.
_version: 2

sidebar.archived:
  en: Archived
  ja: アーカイブ
sidebar.empty.title:
  en: No projects yet
  ja: プロジェクトがありません
sidebar.empty.hint:
  en: ginka project add .
  ja: ginka project add .
sidebar.show_more:
  en: "Show %{count} more"
  ja: "他 %{count} 件を表示"
sidebar.footer.device:
  en: Local
  ja: ローカル

status.working:
  en: Working
  ja: 実行中
status.attention:
  en: Needs you
  ja: 要対応

composer.placeholder:
  en: Do anything…
  ja: なんでもどうぞ…
