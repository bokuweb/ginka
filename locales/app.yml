  en: The terminal surface lands in M3.
  ja: ターミナルサーフェスは M3 で実装されます。
surface.git.pending:
  en: The git surface lands in M3.
  ja: git サーフェスは M3 で実装されます。
surface.empty.title:
  en: Open a surface
  ja: サーフェスを開く
surface.empty.hint:
  en: Choose what to show in the right panel.
  ja: 右パネルに表示するものを選んでください。

cli.agent.ready:
