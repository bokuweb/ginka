[package]
name = "ginka"
version = "0.0.0"
edition = "2024"
description = "An IDE-agnostic coding-agent orchestrator"
publish = false

[workspace]
members = [
    "crates/ginka-client",
    "crates/ginka-cli",
    "crates/ginka-core",
    "crates/ginka-daemon",
    "crates/ginka-protocol",
    "crates/ginka-ui",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
ginka-client = { path = "crates/ginka-client" }
ginka-core = { path = "crates/ginka-core" }
ginka-protocol = { path = "crates/ginka-protocol" }
ginka-ui = { path = "crates/ginka-ui" }

# GPUI arrives transitively through gpui-component: the component library owns
# the rev, and pinning it independently guarantees a conflict on the next
# toolkit upgrade. See docs/roadmap.md §4.6 and docs/gpui-upgrades.md.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }
gpui-wry = { git = "https://github.com/longbridge/gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }

# The GitHub client, mounted as the Inbox (`docs/ui.md` §3.5). A git
# dependency pinned by rev rather than a submodule: the rev lands in
# `Cargo.lock` and Cargo resolves e1's graph into ours. `.cargo/config.toml`
# may patch these to `../e1` for local work.
e1-github = { git = "https://github.com/bokuweb/e1", rev = "076295e" }
e1-ui = { git = "https://github.com/bokuweb/e1", rev = "076295e" }
e1-views = { git = "https://github.com/bokuweb/e1", rev = "076295e" }
raw-window-handle = "0.6"
wry = { version = "0.53.3", package = "lb-wry" }

# The terminal stack the roadmap picked (§4.3): the same one Zed and waku use.
alacritty_terminal = "0.26"
anyhow = "1"
async-channel = "2"
async-net = "2"
# Signals as a stream, from the same ecosystem as the rest of the async stack.
async-signal = "0.2"
# WebSocket without a runtime feature: it works over any futures `AsyncRead +
# AsyncWrite`, which is what keeps the daemon on smol rather than dragging a
# second reactor in behind tokio. See docs/roadmap.md §4.3.
async-tungstenite = "0.35"
# The synchronous client, for the Slack connector's Socket Mode connection:
# it lives on a thread of its own, like a driver's reader, and the TLS it
# needs is the client-side kind the server never uses.
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# A blocking HTTPS client for the Slack Web API, run on the blocking pool.
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }
# The matcher the roadmap picked for quick-open, the command palette and file
# mentions (§4.3). Small, pure Rust, and the same one Helix and Zed use.
base64 = "0.22"
nucleo-matcher = "0.3"
lsp-types = { version = "0.97", features = ["proposed"] }
parking_lot = "0.12"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[features]
# Ginka alone by default: no `e1` in the dependency graph. The orchestrator is
# the product; hosting the GitHub client is opt-in until it is finished.
default = []
# The GitHub client mounted as the Inbox (`docs/ui.md` §3.5). Without it the
# Inbox says how to build it in.
github = ["dep:e1-github", "dep:e1-ui", "dep:e1-views"]

[dependencies]
e1-github = { workspace = true, optional = true }
e1-ui = { workspace = true, optional = true }
e1-views = { workspace = true, optional = true }
ginka-client.workspace = true
rust-i18n.workspace = true
ginka-core.workspace = true
ginka-protocol.workspace = true
ginka-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
async-channel.workspace = true
base64.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-base.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tracing.workspace = true
lsp-types.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui-wry.workspace = true
raw-window-handle.workspace = true
wry.workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[lints]
workspace = true

# e1 names the toolkit by URL alone and Ginka by rev; Cargo reads those as two
# sources and would link two copies of `gpui-component`, whose globals e1's
# views could not see. Point e1's at Ginka's rev so there is one toolkit.
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { git = "https://github.com/longbridge//gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }
gpui-component-assets = { git = "https://github.com/longbridge//gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }
gpui-base = { git = "https://github.com/longbridge//gpui-component", rev = "5a564d4e798f18b66e9c0d85b651e96d3450b0a7" }
