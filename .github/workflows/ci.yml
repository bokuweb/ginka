name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Linux runner's disk fills up once the build and its cache are both
      # on it; the runner's preinstalled SDKs for other languages are not used.
      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan1 libgit2-dev make cmake clang mold
      # The macOS app's browser is Chromium (gpui-cef): cef-dll-sys downloads
      # its distribution (~500MB) to CEF_PATH and builds a wrapper with cmake
      # and ninja. Kept between runs, since that dominates a cold build.
      - name: Prepare Chromium for the macOS browser
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          echo "CEF_PATH=$HOME/.local/share/cef" >> "$GITHUB_ENV"
      - name: Cache Chromium's distribution
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-151.3.24
      - run: cargo fmt --all -- --check
      # Scoped to our workspace: a global RUSTFLAGS=-D warnings would also
      # promote warnings in third-party crates and fail on their schedule.
      - run: mbx clippy --workspace --all-targets -- -D warnings
      - run: mbx clippy --workspace --all-targets --features ginka/github -- -D warnings
      - run: mbx test --workspace
      - name: Package and install the Linux archive
        if: runner.os == 'Linux'
        run: sh scripts/test-package-linux
      - name: Package the macOS app and disk image
        if: runner.os == 'macOS'
        run: sh scripts/test-package-macos
