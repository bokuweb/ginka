name: Signed e1 macOS release artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(awk '/^\[package\]$/ { package = 1; next } /^\[/ { package = 0 } package && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          test "$RELEASE_TAG" = "v$version"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          certificate="$RUNNER_TEMP/e1-certificate.p12"
          keychain="$RUNNER_TEMP/e1-signing.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F 'Developer ID Application: Satoshi Ueki (66U862VS9W)'

      - name: Build and sign universal app
        env:
          E1_CODESIGN_IDENTITY: 'Developer ID Application: Satoshi Ueki (66U862VS9W)'
          E1_SPARKLE_FEED_URL: ${{ vars.E1_SPARKLE_FEED_URL }}
          E1_SPARKLE_PUBLIC_KEY: ${{ vars.E1_SPARKLE_PUBLIC_KEY }}
        run: e1/scripts/bundle-macos.sh release

      - name: Notarize app and disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          E1_CODESIGN_IDENTITY: 'Developer ID Application: Satoshi Ueki (66U862VS9W)'
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          version="${RELEASE_TAG#v}"
          dist=target/dist
          app="$dist/e1.app"
          archive="$dist/e1-v$version-macos-universal.zip"
          image="$dist/e1-v$version-macos-universal.dmg"
          notary() {
            xcrun notarytool submit "$1" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id 66U862VS9W \
              --wait
          }
          notary "$archive"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          stage=$(mktemp -d "$RUNNER_TEMP/e1-dmg.XXXXXX")
          trap 'rm -rf "$stage"' EXIT
          ditto "$app" "$stage/e1.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname e1 -srcfolder "$stage" -ov -format UDZO "$image"
          codesign --force --timestamp --sign "$E1_CODESIGN_IDENTITY" "$image"
          notary "$image"
          xcrun stapler staple "$image"
          xcrun stapler validate "$image"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          (cd "$dist" && shasum -a 256 "$(basename "$archive")" "$(basename "$image")" > e1-SHA256SUMS)

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e1-${{ github.event.release.tag_name }}-macos
          path: |
            target/dist/e1-v*-macos-universal.zip
            target/dist/e1-v*-macos-universal.dmg
            target/dist/e1-SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Attach signed artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "target/dist/e1-v$version-macos-universal.dmg" \
            "target/dist/e1-v$version-macos-universal.zip" \
            target/dist/e1-SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/e1-signing.keychain-db" || true
