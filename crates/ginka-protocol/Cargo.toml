[package]
name = "ginka-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Wire types shared by the Ginka app, daemon and CLI"

# The exporter is a feature rather than a dependency: the app, the daemon and
# the CLI all link this crate, and none of them should carry a TypeScript
# generator around to run it.
[features]
export = ["dep:ts-rs"]

[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
required-features = ["export"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ts-rs = { version = "12", features = ["serde-json-impl"], optional = true }
uuid.workspace = true

[lints]
workspace = true
