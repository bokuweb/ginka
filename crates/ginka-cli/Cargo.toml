[package]
name = "ginka-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The `ginka` command"

# The app crate at the workspace root already produces a `ginka` binary, and two
# targets with one name silently overwrite each other in `target/debug`. The
# CLI is installed as `ginka` at packaging time; during development it is
# `ginka-cli`.
[[bin]]
name = "ginka-cli"
path = "src/main.rs"

[dependencies]
ginka-client.workspace = true
ginka-core.workspace = true
ginka-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
rusqlite.workspace = true
rust-i18n.workspace = true
serde_json.workspace = true
smol.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
